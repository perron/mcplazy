[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplazy"
version = "0.1.1"
description = "Lazy MCP gateway that exposes catalog search and on-demand schemas instead of dumping every tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "mcp", "cli", "gateway"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/mcplazy"
Repository = "https://github.com/perron/mcplazy"
Issues = "https://github.com/perron/mcplazy/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcplazy = "mcplazy.cli:main"

[tool.setuptools.packages.find]
include = ["mcplazy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
